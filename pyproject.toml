[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-dashboard"
version = "1.0.0"
description = "Local cost, usage, and control dashboard for MCP servers and agent skills"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SarutobiSasuke8" }]
keywords = ["mcp", "model-context-protocol", "dashboard", "claude-code", "codex"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
cpu = ["psutil>=5.9"]
dev = ["build>=1.2", "ruff>=0.9", "twine>=6"]

[project.scripts]
mcp-dashboard = "mcp_dashboard:main"

[project.urls]
Homepage = "https://github.com/SarutobiSasuke8/mcp-dashboard"
Documentation = "https://github.com/SarutobiSasuke8/mcp-dashboard#readme"
Issues = "https://github.com/SarutobiSasuke8/mcp-dashboard/issues"
Changelog = "https://github.com/SarutobiSasuke8/mcp-dashboard/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["mcp_dashboard"]

[tool.setuptools.packages.find]
include = ["mcpdash*"]

[tool.ruff]
target-version = "py310"
line-length = 100
